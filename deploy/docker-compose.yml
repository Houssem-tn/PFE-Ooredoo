# Local Docker Compose environment for the Ooredoo Field Service Management
# app. See DOCKER.md for prerequisites, commands, and the full explanation
# of every non-obvious decision referenced in the comments below.
#
# Usage: docker compose --env-file .env.docker up -d --build
#
# Services started by default (no --profile flag): frontend, backend,
# mongodb, minio, minio-init. The OCR microservice is heavy (loads EasyOCR
# models into memory) and opt-in via `--profile ocr`.

networks:
  # frontend <-> backend only. mongodb/minio/ocr are never reachable from
  # the frontend container even if it were compromised.
  edge:
  # backend <-> its data/AI dependencies. Not attached to `edge`.
  internal:

volumes:
  mongodb_data:
  minio_data:

services:
  # =========================================================================
  # MongoDB
  # =========================================================================
  mongodb:
    # Pinned to the 7.0 branch tag (not `latest`). Docker was unavailable
    # in the environment this was authored in, so this could not be
    # pulled/verified — run `docker pull mongo:7.0` once and update this
    # if Docker Hub no longer serves it. See DOCKER.md "Known limitations".
    image: mongo:7.0
    restart: unless-stopped
    networks: [internal]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username", "${MONGODB_USERNAME}",
          "--password", "${MONGODB_PASSWORD}",
          "--authenticationDatabase", "admin",
          "--quiet",
          "--eval", "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No host port mapping by default — only reachable from other Compose
    # services on the `internal` network. See docker-compose.debug.yml to
    # opt into a host-mapped port for a local GUI client (Compass, etc).

  # =========================================================================
  # MinIO
  # =========================================================================
  minio:
    # MinIO only publishes timestamped RELEASE.<date>Z tags, no long-lived
    # channel alias — this specific tag could not be pulled/verified in
    # this environment (no internet-connected Docker available). Run
    # `docker pull minio/minio:<tag>` once and update if it 404s; see
    # DOCKER.md "Known limitations".
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    networks: [internal]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # No host port mapping by default — see docker-compose.debug.yml for
    # the API (9000) / console (9001) host-mapped ports.

  # One-shot: creates the app's bucket if it doesn't already exist, then
  # exits. Runs `mc` (MinIO's own client) rather than hand-rolling an S3
  # API call — it's the tool MinIO itself documents for this exact job.
  minio-init:
    # Same caveat as the minio image above — verify with `docker pull`.
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    networks: [internal]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    # `mc mb --ignore-existing` is idempotent — safe to run on every
    # `compose up`, not just the first one.
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" &&
        mc mb --ignore-existing local/$$MINIO_BUCKET
    restart: "no"

  # =========================================================================
  # Backend (Spring Boot)
  # =========================================================================
  backend:
    build:
      context: ./APPSTOCK/PFE-Ooredoo
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [edge, internal]
    depends_on:
      mongodb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # Compose service name, never localhost — see
      # ProductionSafetyEnvironmentPostProcessor (only enforced under
      # `prod`, but correct at every profile).
      MONGODB_URI: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/${MONGODB_DATABASE}?authSource=admin
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      OCR_API_URL: ${OCR_API_URL}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    # No host port mapping by default — reached only via the frontend's
    # nginx proxy. See docker-compose.debug.yml to expose 8080 directly
    # (e.g. for hitting the API/Swagger UI without going through nginx).

  # =========================================================================
  # OCR microservice (opt-in: docker compose --profile ocr up)
  # =========================================================================
  ocr:
    build:
      context: ./EacyOCR
      dockerfile: Dockerfile
    profiles: ["ocr"]
    restart: unless-stopped
    networks: [internal]
    # No host port mapping by default — only the backend calls this
    # service, over the `internal` network. See docker-compose.debug.yml.

  # =========================================================================
  # Frontend (Angular, served by nginx)
  # =========================================================================
  frontend:
    build:
      context: ./Pfe-Oreedoo-Front
      dockerfile: Dockerfile
      args:
        MAPTILER_KEY: ${MAPTILER_KEY:-}
    restart: unless-stopped
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
