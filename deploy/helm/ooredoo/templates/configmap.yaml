apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: {{ include "ooredoo.namespace" . }}
  labels:
    {{- include "ooredoo.labels" . | nindent 4 }}
    {{- include "ooredoo.selectorLabels" (dict "name" "backend" "context" $) | nindent 4 }}
data:
  # Every key here maps 1:1 to an env-var name application.properties (and
  # application-prod.properties) already reads — see
  # APPSTOCK/PFE-Ooredoo/src/main/resources/application*.properties. Only
  # non-sensitive values live here; credentials are in secrets.yaml.
  SPRING_PROFILES_ACTIVE: {{ .Values.backend.springProfile | quote }}
  SERVER_PORT: {{ .Values.backend.containerPort | quote }}

  MONGODB_DATABASE: {{ .Values.backend.mongodb.database | quote }}
  # Kubernetes Service DNS, never localhost — see values.yaml's
  # comment on why "mongodb" is this chart's literal Service name.
  MONGODB_HOST: "mongodb"
  MONGODB_PORT: {{ .Values.mongodb.port | quote }}

  MINIO_URL: {{ .Values.backend.minio.url | quote }}
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}

  OCR_API_URL: {{ .Values.backend.ocr.url | quote }}

  APP_CORS_ALLOWED_ORIGINS: {{ .Values.backend.corsAllowedOrigins | quote }}
  APP_FRONTEND_URL: {{ .Values.backend.frontendUrl | quote }}
  APP_JWT_EXPIRATION: {{ .Values.backend.jwt.expirationMs | quote }}

  MAIL_ENABLED: {{ .Values.backend.mail.enabled | quote }}
  MAIL_HOST: {{ .Values.backend.mail.host | quote }}
  MAIL_PORT: {{ .Values.backend.mail.port | quote }}
  MAIL_FROM: {{ .Values.backend.mail.from | quote }}
