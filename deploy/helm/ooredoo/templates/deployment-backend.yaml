apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "ooredoo.namespace" . }}
  labels:
    {{- include "ooredoo.labels" . | nindent 4 }}
    {{- include "ooredoo.selectorLabels" (dict "name" "backend" "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ooredoo.selectorLabels" (dict "name" "backend" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ooredoo.labels" . | nindent 8 }}
        {{- include "ooredoo.selectorLabels" (dict "name" "backend" "context" $) | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            # --- Observability (see logback-spring.xml / OBSERVABILITY_BACKUP.md "Logging fields") ---
            - name: LOGGING_JSON_ENABLED
              value: {{ .Values.logging.json | quote }}
            # Spring Boot relaxed-binds this env var to logging.level.com.pfe
            # — lets an operator raise/lower app-package verbosity without a
            # rebuild, on top of whatever application-{dev,prod}.properties
            # already set as the baseline (see OBSERVABILITY_BACKUP.md "Log levels").
            - name: LOGGING_LEVEL_COM_PFE
              value: {{ .Values.logging.level | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # --- Mongo credentials (Secret) ---
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecret | default "mongodb-secret" }}
                  key: mongodb-username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecret | default "mongodb-secret" }}
                  key: mongodb-password
            # Kubernetes' $(VAR) dependent-env-var expansion is only
            # documented/guaranteed to resolve against variables defined
            # earlier in this same `env:` list — NOT against ones sourced
            # via `envFrom` above, so MONGODB_PORT/MONGODB_DATABASE are
            # re-declared here explicitly (still reading the same
            # backend-config keys, just via configMapKeyRef instead of
            # relying on envFrom ordering) rather than risk MONGODB_URI
            # silently resolving to a literal "$(MONGODB_PORT)" string.
            - name: MONGODB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_PORT
            - name: MONGODB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGODB_DATABASE
            # Composed from the four pieces above — never places the
            # credential in a ConfigMap or hardcodes it, matches
            # mongodb://<user>:<password>@mongodb:<port>/<database>?authSource=admin
            # exactly, using Kubernetes Service DNS ("mongodb"), never
            # localhost. See KUBERNETES.md "MongoDB StatefulSet".
            - name: MONGODB_URI
              value: "mongodb://$(MONGODB_USERNAME):$(MONGODB_PASSWORD)@mongodb:$(MONGODB_PORT)/$(MONGODB_DATABASE)?authSource=admin"

            # --- MinIO credentials (Secret) ---
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.auth.existingSecret | default "minio-secret" }}
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.auth.existingSecret | default "minio-secret" }}
                  key: minio-secret-key

            # --- JWT / mail (Secret) ---
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secrets.existingSecret | default "backend-secret" }}
                  key: jwt-secret
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secrets.existingSecret | default "backend-secret" }}
                  key: mail-username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secrets.existingSecret | default "backend-secret" }}
                  key: mail-password
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startupPath }}
              port: {{ .Values.backend.containerPort }}
            # Generous allowance for JVM start + Spring context init +
            # first Mongo connection (up to 90s) before liveness/readiness
            # take over — a cold Spring Boot start under limited CPU
            # requests can legitimately take tens of seconds.
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readinessPath }}
              port: {{ .Values.backend.containerPort }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.livenessPath }}
              port: {{ .Values.backend.containerPort }}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            {{- range .Values.backend.emptyDirs }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        {{- range .Values.backend.emptyDirs }}
        - name: {{ .name }}
          emptyDir: {}
        {{- end }}
