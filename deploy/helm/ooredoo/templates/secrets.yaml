{{/*
Safe templates only — no real value is ever committed. Every secret value
below is required (Helm's `required` fails template rendering itself,
with a clear error, if the value is empty) rather than shipped with a
plausible-looking default — an earlier draft of this file used
"CHANGE_ME_..." placeholders, which was actually a real problem, not just
a style choice: several of those placeholders were long enough to pass
ProductionSafetyEnvironmentPostProcessor's own length check unedited,
which would have let `helm install` with no overrides silently run with a
predictable, publicly-committed secret instead of failing loudly. `required`
below fails at `helm template`/`helm install` time instead, before
anything is ever created — see KUBERNETES.md "Secrets" for how to supply
real values (--set-string, a local untracked values file, or an
existingSecret reference, which skips rendering the corresponding block
below entirely).
*/}}

{{- if not .Values.backend.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: {{ include "ooredoo.namespace" . }}
  labels:
    {{- include "ooredoo.labels" . | nindent 4 }}
    {{- include "ooredoo.selectorLabels" (dict "name" "backend" "context" $) | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "backend.secrets.jwtSecret is required (32+ random chars) — set via --set-string or backend.secrets.existingSecret" .Values.backend.secrets.jwtSecret | quote }}
  # Mail is off by default (backend.mail.enabled: false) — these two stay
  # optional (not `required`) since they're only meaningful once mail is
  # actually turned on, at which point application-prod.properties'
  # own checkMail validation catches a missing value at pod startup anyway.
  mail-username: {{ .Values.backend.secrets.mail.username | quote }}
  mail-password: {{ .Values.backend.secrets.mail.password | quote }}
{{- end }}

---
{{- if not .Values.mongodb.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: {{ include "ooredoo.namespace" . }}
  labels:
    {{- include "ooredoo.labels" . | nindent 4 }}
    {{- include "ooredoo.selectorLabels" (dict "name" "mongodb" "context" $) | nindent 4 }}
type: Opaque
stringData:
  mongodb-username: {{ required "mongodb.auth.username is required" .Values.mongodb.auth.username | quote }}
  mongodb-password: {{ required "mongodb.auth.password is required (set via --set-string or mongodb.auth.existingSecret)" .Values.mongodb.auth.password | quote }}
{{- end }}

---
{{- if not .Values.minio.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: {{ include "ooredoo.namespace" . }}
  labels:
    {{- include "ooredoo.labels" . | nindent 4 }}
    {{- include "ooredoo.selectorLabels" (dict "name" "minio" "context" $) | nindent 4 }}
type: Opaque
stringData:
  minio-access-key: {{ required "minio.auth.accessKey is required (set via --set-string or minio.auth.existingSecret)" .Values.minio.auth.accessKey | quote }}
  minio-secret-key: {{ required "minio.auth.secretKey is required (set via --set-string or minio.auth.existingSecret)" .Values.minio.auth.secretKey | quote }}
{{- end }}
