# =========================================================================
# Development profile — local machine, localhost services, verbose logs.
# Activate with: SPRING_PROFILES_ACTIVE=dev  (this is also the default when
# SPRING_PROFILES_ACTIVE is unset — see application.properties).
# No real credentials belong in this file.
# =========================================================================

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pfe}

minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

# Safe default is localhost-only. Set APP_CORS_ALLOWED_ORIGINS to add LAN
# IPs, ngrok tunnels, or other origins for your machine.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://localhost:4200,https://127.0.0.1:4200}

ocr.api.url=${OCR_API_URL:http://localhost:8000/extract}

# Real email sending is off by default locally so no SMTP account is needed
# to run the app. Set MAIL_ENABLED=true (and MAIL_USERNAME/MAIL_PASSWORD) to
# exercise real email flows.
app.mail.enabled=${MAIL_ENABLED:false}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Readable, developer-friendly logging.
logging.level.root=INFO
logging.level.com.pfe=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=INFO

# Verbose error responses to speed up local debugging.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
