# =========================================================================
# Test profile — used by `mvnw test` (auto-activated via
# src/test/resources/application.properties). Must never touch dev or prod
# data, never send real email, and stay fast/deterministic.
#
# NOTE: src/test/resources/application.properties SHADOWS (does not merge
# with) src/main/resources/application.properties on the test classpath —
# Spring Boot resolves classpath:/application.properties to a single
# resource. This file must therefore be self-contained; it cannot rely on
# "shared" values from the base application.properties.
# =========================================================================

spring.application.name=PFE

# Required so Spring Boot's mail autoconfiguration creates a JavaMailSender
# bean (EmailService depends on one) even though app.mail.enabled=false
# below means it's never actually used to send anything.
spring.mail.host=smtp.gmail.com
spring.mail.port=587

app.jwt.expiration-ms=86400000
app.storage.local-dir=${java.io.tmpdir}/pfe-files-test

# Dedicated test database. Defaults to a DIFFERENT db name than dev (pfe vs
# pfe_test) so tests can never silently pollute local development data, even
# if MONGODB_URI is left unset. Point MONGODB_URI at a disposable instance
# if you want tests to use a separate MongoDB server entirely.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pfe_test}

# MinIO is not required for tests: FileStorageService already falls back to
# local disk storage automatically whenever a MinIO call fails, so pointing
# at a (likely absent) local instance is safe — no test should depend on a
# real MinIO server being up. Uses a dedicated bucket name regardless.
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:pfe-files-test}

app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# OCR is not called during context startup, only from explicit extraction
# flows. No real OCR service is expected to be running for tests; any test
# that needs OCR behavior should mock OcrClientService rather than rely on
# this URL being reachable.
ocr.api.url=${OCR_API_URL:http://localhost:8000/extract}

# Real email is always off in tests — not configurable via env var, so a
# developer's shell can't accidentally enable it during a test run.
app.mail.enabled=false

# Fixed, dedicated test-only secret — intentionally NOT sourced from
# APP_JWT_SECRET so a developer's real/local secret can never leak into (or
# make) test behavior inconsistent. This value is not sensitive: it is
# public, checked into the repo on purpose, and must never be reused outside
# tests.
app.jwt.secret=test-only-jwt-secret-DO-NOT-USE-IN-PRODUCTION-0000000000

app.frontend-url=http://localhost:4200

# Scheduler is not disabled (would require touching SlaSchedulerService),
# but pushed far out so it cannot fire meaningfully during a test run.
app.sla.scheduler-delay-ms=3600000

logging.level.root=WARN
logging.level.com.pfe=INFO
