# Optional supplementary profile — layer on top of `dev`, e.g.:
#   SPRING_PROFILES_ACTIVE=dev,https-local
# Enables local HTTPS via mkcert-generated dev certs (see /dev-certs).
server.port=8080
server.ssl.enabled=true
server.ssl.certificate=file:../../dev-certs/local-https/dev-local.pem
server.ssl.certificate-private-key=file:../../dev-certs/local-https/dev-local-key.pem

# Set APP_CORS_ALLOWED_ORIGINS to include your LAN IP or ngrok tunnel when
# testing HTTPS from another device, e.g.:
#   APP_CORS_ALLOWED_ORIGINS=https://localhost:4200,https://192.168.1.x:4200,https://*.ngrok-free.dev
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://localhost:4200,https://127.0.0.1:4200}
