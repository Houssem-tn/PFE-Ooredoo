# =========================================================================
# Production profile — every environment-specific value is REQUIRED via
# environment variable, with NO localhost/dev fallback. Missing or unsafe
# values are caught at startup by ProductionSafetyValidator (fails fast,
# before the app starts accepting traffic). Never place real values in this
# file — it only wires property names to env vars.
# =========================================================================

spring.mongodb.uri=${MONGODB_URI}

minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}

# No default: must be an explicit, comma-separated list of real frontend
# origins. No wildcards, no localhost.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

ocr.api.url=${OCR_API_URL}

app.mail.enabled=${MAIL_ENABLED:true}

app.frontend-url=${APP_FRONTEND_URL}

# Production logging: no per-request DEBUG noise.
logging.level.root=WARN
logging.level.com.pfe=INFO
logging.level.org.springframework.web=WARN

# Never leak stack traces / internal exception details to API responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator exposure (health-only, no details) is configured in the shared
# application.properties and applies here unchanged — do not widen it in
# this file.
