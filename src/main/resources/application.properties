# =========================================================================
# Base configuration — shared by every profile (dev / test / prod).
# Only put values here that are the SAME across all environments.
# Environment-specific values (DB, MinIO, CORS, mail credentials, logging
# verbosity, ...) live in application-{dev,test,prod}.properties.
# =========================================================================

spring.application.name=PFE

# Default profile when SPRING_PROFILES_ACTIVE is not set. Local `mvnw
# spring-boot:run` therefore behaves like development out of the box.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Reverse-proxy support (X-Forwarded-* headers), needed in every environment
# that sits behind a proxy (dev via ngrok, prod via nginx/traefik/etc.).
server.forward-headers-strategy=framework
server.port=${SERVER_PORT:8080}

# Graceful shutdown: on SIGTERM (docker stop / compose down / orchestrator
# restart), stop accepting new requests but let in-flight ones finish
# instead of cutting them off mid-response. Relies on the container
# ENTRYPOINT being exec-form so SIGTERM reaches the JVM directly (PID 1).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.web=WARN

# Read by logback-spring.xml's <if> to pick the JSON (Loki-friendly) vs
# plain-text console appender — see that file's own comment. Defaults to
# plain text for local `mvnw spring-boot:run`; every Kubernetes
# environment sets LOGGING_JSON_ENABLED=true (see
# deploy/helm/ooredoo/values.yaml's logging.json).
logging.json.enabled=${LOGGING_JSON_ENABLED:false}

# =========================
# JWT
# =========================
# Dev-only fallback lives in code (JwtService); ALWAYS set APP_JWT_SECRET
# outside of local dev. See application-prod.properties for the hard
# requirement enforced at startup.
app.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION:86400000}

# =========================
# Mail (transport settings are shared; credentials/enable flag are per-profile)
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# "From" header used for outgoing mail; falls back to the SMTP username.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# =========================
# MinIO / file storage
# =========================
minio.bucket=${MINIO_BUCKET:pfe-files}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB
app.storage.local-dir=${APP_STORAGE_LOCAL_DIR:${java.io.tmpdir}/pfe-files}

# =========================
# Frontend URL (used to build links, e.g. technician invitation & password-reset
# emails). Password-reset links are built from THIS value only, never from a
# request Host header. In prod this is a hard requirement enforced at startup by
# ProductionSafetyEnvironmentPostProcessor (no localhost fallback).
# =========================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# =========================
# Password reset (forgot-password / reset-password flow). All values have safe
# dev defaults and can be overridden per-environment via the listed env vars.
# The reset email sender ADDRESS reuses app.mail.from; only the display NAME is
# configured here.
# =========================
app.password-reset.token-expiration-minutes=${APP_PWRESET_TOKEN_EXPIRATION_MINUTES:20}
app.password-reset.max-active-tokens-per-user=${APP_PWRESET_MAX_ACTIVE_TOKENS:3}
app.password-reset.request-cooldown-seconds=${APP_PWRESET_REQUEST_COOLDOWN_SECONDS:60}
app.password-reset.max-requests-per-email-per-hour=${APP_PWRESET_MAX_REQUESTS_PER_EMAIL:5}
app.password-reset.max-requests-per-ip-per-hour=${APP_PWRESET_MAX_REQUESTS_PER_IP:20}
app.password-reset.max-reset-attempts-per-ip-per-hour=${APP_PWRESET_MAX_RESET_ATTEMPTS_PER_IP:30}
app.password-reset.email-sender-name=${APP_PWRESET_EMAIL_SENDER_NAME:Ooredoo Field Service Platform}

# =========================
# SLA (Activation RDV)
# =========================
app.sla.rdv-window=${APP_SLA_RDV_WINDOW:6h}
app.sla.warning-threshold=${APP_SLA_WARNING_THRESHOLD:0.5}
app.sla.scheduler-delay-ms=${APP_SLA_SCHEDULER_DELAY_MS:30000}
app.sla.escalation-threshold-minutes=${APP_SLA_ESCALATION_THRESHOLD_MINUTES:30}

# =========================
# OCR microservice
# =========================
ocr.api.url=${OCR_API_URL:http://localhost:8000/extract}

# =========================
# Actuator — container/orchestrator health checks, plus the Prometheus
# scrape endpoint and basic build info. No other endpoint (env, beans,
# configprops, heapdump, logfile, mappings, ...) is exposed in any
# profile. Never widen management.endpoints.web.exposure.include without
# reviewing what the added endpoint leaks — see OBSERVABILITY_BACKUP.md
# "Backend metrics" for the explicit list of endpoints that must never be
# exposed. /actuator/prometheus and /actuator/health/* are reachable only
# from inside the cluster (backend Kubernetes Service is ClusterIP-only,
# never referenced by the Ingress — see deploy/helm/ooredoo/templates/
# ingress.yaml — and Prometheus itself only scrapes via a ServiceMonitor,
# never through the public Ingress).
# =========================
management.endpoints.web.exposure.include=health,prometheus,info
# Never return dependency details (e.g. Mongo connection strings/error
# messages) in the response body — only the aggregate UP/DOWN status.
management.endpoint.health.show-details=never
# /actuator/health/liveness  = process started (no dependency checks)
# /actuator/health/readiness = ready to serve traffic (includes Mongo)
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo

# =========================
# Metrics (Micrometer -> Prometheus). See OBSERVABILITY_BACKUP.md for the
# full metric catalogue (JVM/process/HTTP are automatic via Actuator +
# micrometer-registry-prometheus; com.pfe.metrics.BusinessMetrics adds the
# small, focused set of custom ones).
# =========================
# Attached to every metric this app emits — lets one Prometheus instance
# scrape multiple environments/instances without needing separate jobs.
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:dev}
# http.server.requests histogram buckets — needed for latency percentiles
# in Grafana/alerting (histogram_quantile); plain min/max/count/sum alone
# can't answer "p95 request latency".
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Route template (e.g. "/api/v1/cases/{id}"), never the raw resolved URI —
# a raw-URI tag would be unbounded cardinality (one series per case ID).
management.metrics.web.server.request.autotime.enabled=true
